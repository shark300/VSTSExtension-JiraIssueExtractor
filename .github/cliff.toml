# Conventional Commits -> SemVer; used only by the release workflow.
# git-cliff is pinned in .github/tools/package.json.
# Only changes affecting the shipped task should bump the extension version.

[git]
conventional_commits = true
filter_unconventional = true
filter_commits = true
protect_breaking_commits = true
tag_pattern = '^[0-9]+\.[0-9]+\.[0-9]+$'
commit_parsers = [
  { message = '^feat', group = 'Features' },
  { message = '^fix', group = 'Bug fixes' },
  { message = '^perf', group = 'Performance' },
  { message = '^revert', group = 'Reverts' },
  # Skip maintenance-only commits (including dev tools and GitHub Actions).
  { message = '.*', skip = true },
]

[bump]
features_always_bump_minor = true
breaking_always_bump_major = true
no_increment_regex = '^(ci|docs|test|style|build|refactor)$'
