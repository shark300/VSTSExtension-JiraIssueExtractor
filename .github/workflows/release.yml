name: Build and release Azure DevOps VSIX

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-2022
    defaults:
      run:
        shell: bash
    outputs:
      version: ${{ steps.version.outputs.version }}
      base_version: ${{ steps.version.outputs.base_version }}
      has_version_bump: ${{ steps.version.outputs.has_version_bump }}
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      VSIX_PREFIX: AttilaHajdu.jira-issue-extractor
    steps:
      - name: Checkout source with full commit history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Calculate SemVer from conventional commits
        id: version
        shell: bash
        run: |
          python3 - <<'PY'
          import os
          import re
          import subprocess

          def git(*args):
              return subprocess.check_output(['git', *args], text=True).strip()

          # Use the first-parent history, not tags from unrelated branches.
          mainline = git('rev-list', '--first-parent', 'HEAD').splitlines()
          tag_by_commit = {}
          for tag in git('tag', '--list').splitlines():
              if re.fullmatch(r'\d+\.\d+\.\d+', tag):
                  sha = git('rev-list', '-n', '1', tag)
                  tag_by_commit.setdefault(sha, []).append(tag)
          base_tag = None
          for sha in mainline:
              if sha in tag_by_commit:
                  base_tag = max(tag_by_commit[sha], key=lambda x: tuple(map(int, x.split('.'))))
                  break
          if not base_tag:
              raise SystemExit('No version tag found in first-parent history')

          major, minor, patch = map(int, base_tag.split('.'))
          messages = subprocess.check_output([
              'git', 'log', '--no-merges', '-z', '--format=%B', f'{base_tag}..HEAD'
          ]).decode('utf-8').split('\x00')
          bump = 0
          for message in messages:
              message = message.strip()
              if not message:
                  continue
              first_line = message.splitlines()[0]
              match = re.match(r'^([a-z][a-z0-9-]*)(?:\([^)]+\))?(!)?:\s+\S', first_line, re.I)
              if not match:
                  continue
              kind = match.group(1).lower()
              if match.group(2) or re.search(r'(?mi)^BREAKING[ -]CHANGE:\s+\S', message):
                  bump = max(bump, 3)
              elif kind == 'feat':
                  bump = max(bump, 2)
              elif kind in {'fix', 'perf', 'revert'}:
                  bump = max(bump, 1)

          version = (
              f'{major + 1}.0.0' if bump == 3 else
              f'{major}.{minor + 1}.0' if bump == 2 else
              f'{major}.{minor}.{patch + 1}' if bump == 1 else base_tag
          )
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              print(f'base_version={base_tag}', file=output)
              print(f'version={version}', file=output)
              print(f'has_version_bump={str(bump > 0).lower()}', file=output)
          print(f'Baseline: {base_tag}; bump: {bump}; build version: {version}')
          PY

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: tasks/extractor/package-lock.json

      - name: Use npm 8 for the repository's npm lockfile v2
        run: npm install --global npm@8.19.4

      - name: Install locked task dependencies
        run: npm ci --no-audit --no-fund
        working-directory: tasks/extractor

      - name: Compile TypeScript from source
        run: npm run build
        working-directory: tasks/extractor

      - name: Check the expected task entry point
        run: test -s tasks/extractor/dist/index.js

      - name: Prune development-only dependencies before packaging
        run: npm prune --omit=dev --no-audit --no-fund
        working-directory: tasks/extractor

      - name: Download the previous published VSIX for comparison only
        shell: bash
        env:
          BASE_VERSION: ${{ steps.version.outputs.base_version }}
        run: |
          set -euo pipefail
          mkdir -p baseline
          gh release download "$BASE_VERSION" \
            --pattern "$VSIX_PREFIX-$BASE_VERSION.vsix" \
            --dir baseline
          test -s "baseline/$VSIX_PREFIX-$BASE_VERSION.vsix"

      - name: Exclude files absent from the previous release payload
        shell: bash
        env:
          BASE_VERSION: ${{ steps.version.outputs.base_version }}
        run: |
          python3 - <<'PY'
          import os
          from pathlib import Path
          from zipfile import ZipFile

          old = Path('baseline') / (os.environ['VSIX_PREFIX'] + '-' + os.environ['BASE_VERSION'] + '.vsix')
          root = Path('tasks/extractor')
          with ZipFile(old) as archive:
              allowed = set(archive.namelist())
          removed = []
          for path in root.rglob('*'):
              if path.is_file() or path.is_symlink():
                  name = path.as_posix()
                  if name not in allowed:
                      path.unlink()
                      removed.append(name)
          for path in sorted((p for p in root.rglob('*') if p.is_dir()), key=lambda p: len(p.parts), reverse=True):
              if not any(path.iterdir()):
                  path.rmdir()
          print('Removed build-time files that were not in the released payload:')
          print('\n'.join(removed))
          PY

      - name: Install pinned Azure DevOps VSIX packager
        run: npm install --global tfx-cli@0.24.2 --no-audit --no-fund

      - name: Package from source without modifying the manifest
        shell: bash
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          mkdir -p dist
          tfx extension create \
            --manifest-globs vss-extension.json \
            --override "{\"version\":\"$VERSION\"}" \
            --output-path "dist/$VSIX_PREFIX-$VERSION.vsix" \
            --no-prompt
          test -s "dist/$VSIX_PREFIX-$VERSION.vsix"
          git diff --exit-code -- vss-extension.json

      - name: Verify source-built VSIX content against the baseline
        shell: bash
        env:
          BASE_VERSION: ${{ steps.version.outputs.base_version }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          python3 - <<'PY'
          import hashlib
          import os
          import re
          import zipfile
          from pathlib import Path

          prefix, base, version = (os.environ[x] for x in ('VSIX_PREFIX', 'BASE_VERSION', 'VERSION'))
          old_path = Path('baseline') / f'{prefix}-{base}.vsix'
          new_path = Path('dist') / f'{prefix}-{version}.vsix'
          report = Path('dist/vsix-comparison.md')

          with zipfile.ZipFile(old_path) as before, zipfile.ZipFile(new_path) as after:
              if before.testzip() or after.testzip():
                  raise RuntimeError('Damaged ZIP member in VSIX')
              old_names, new_names = set(before.namelist()), set(after.namelist())
              missing, added = sorted(old_names - new_names), sorted(new_names - old_names)
              changed = []

              def identity_without_version(data, expected):
                  pattern = rb'(<Identity\b[^>]*?\bVersion\s*=\s*["\'])' + re.escape(expected.encode()) + rb'(["\'])'
                  out, count = re.subn(pattern, lambda m: m[1] + b'<VERSION>' + m[2], data, flags=re.I)
                  if count != 1:
                      raise ValueError(f'Expected exactly one Identity Version={expected}, found {count}')
                  return out

              for name in sorted(old_names & new_names):
                  left, right = before.read(name), after.read(name)
                  if left == right:
                      continue
                  if name == 'extension.vsixmanifest':
                      try:
                          if identity_without_version(left, base) == identity_without_version(right, version):
                              continue
                      except ValueError:
                          pass
                  changed.append(name)
              if base != version and 'extension.vsixmanifest' in old_names & new_names:
                  if before.read('extension.vsixmanifest') == after.read('extension.vsixmanifest'):
                      changed.append('extension.vsixmanifest (version did not change)')

          result = not (missing or added or changed)
          body = [
              f'# Source-built VSIX: {base} versus {version}',
              '',
              f'- Baseline bytes: {old_path.stat().st_size}',
              f'- New bytes: {new_path.stat().st_size}',
              f'- New SHA256: {hashlib.sha256(new_path.read_bytes()).hexdigest()}',
              f'- Missing files: {len(missing)}',
              f'- Extra files: {len(added)}',
              f'- Unexpected changed files: {len(changed)}',
              f'- Result: {"PASS" if result else "FAIL"}',
          ]
          for label, names in (('Missing', missing), ('Extra', added), ('Changed', changed)):
              if names:
                  body.extend(['', f'## {label} files', ''])
                  body.extend('- ' + name for name in names[:100])
                  if len(names) > 100:
                      body.append(f'- … and {len(names)-100} more')
          report.write_text('\n'.join(body) + '\n')
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a') as summary:
              summary.write('\n'.join(body) + '\n')
          print('\n'.join(body))
          if not result:
              raise SystemExit('Source-built VSIX differs beyond the extension version')
          PY

      - name: Upload VSIX and comparison report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: vsix-source-build
          path: |
            dist/*.vsix
            dist/vsix-comparison.md
          if-no-files-found: error

  publish:
    if: (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/main' && needs.build.outputs.has_version_bump == 'true'
    needs: build
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      VERSION: ${{ needs.build.outputs.version }}
      VSIX_PREFIX: AttilaHajdu.jira-issue-extractor
    steps:
      - name: Download verified VSIX
        uses: actions/download-artifact@v4
        with:
          name: vsix-source-build
          path: dist

      - name: Refuse to overwrite an existing release
        shell: bash
        run: |
          set -euo pipefail
          if gh release view "$VERSION" >/dev/null 2>&1; then
            echo "::error::Release $VERSION already exists; refusing to overwrite."
            exit 1
          fi
          test -s "dist/$VSIX_PREFIX-$VERSION.vsix"

      - name: Publish to Visual Studio Marketplace if credentials exist
        shell: bash
        env:
          MARKETPLACE_PAT: ${{ secrets.MARKETPLACE_PAT }}
        run: |
          set -euo pipefail
          if [ -z "$MARKETPLACE_PAT" ]; then
            echo "::notice::Marketplace upload skipped: MARKETPLACE_PAT secret missing."
            exit 0
          fi
          npm install --global tfx-cli@0.24.2 --no-audit --no-fund
          tfx extension publish --publisher AttilaHajdu \
            --vsix "dist/$VSIX_PREFIX-$VERSION.vsix" \
            --auth-type pat --token "$MARKETPLACE_PAT" --no-prompt

      - name: Publish the verified VSIX as a GitHub Release
        shell: bash
        run: |
          set -euo pipefail
          gh release create "$VERSION" "dist/$VSIX_PREFIX-$VERSION.vsix" \
            --target "$GITHUB_SHA" --title "$VERSION" \
            --notes "Built from source using npm ci, TypeScript and tfx-cli. Version computed from conventional commits. Compared VSIX contents against the previous release, allowing only extension version differences."
