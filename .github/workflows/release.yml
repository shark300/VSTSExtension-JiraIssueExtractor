name: Build and release Azure DevOps VSIX

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-2022
    defaults:
      run:
        shell: bash
    outputs:
      version: ${{ steps.version.outputs.version }}
      has_version_bump: ${{ steps.version.outputs.has_version_bump }}
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      VSIX_PREFIX: AttilaHajdu.jira-issue-extractor
    steps:
      - name: Preserve source file line endings on Windows
        run: git config --global core.autocrlf false

      - name: Checkout source with full commit history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Calculate SemVer from conventional commits
        id: version
        shell: bash
        run: |
          python3 - <<'PY'
          import os
          import re
          import subprocess

          def git(*args):
              return subprocess.check_output(['git', *args], text=True).strip()

          # Use the first-parent history, not tags from unrelated branches.
          mainline = git('rev-list', '--first-parent', 'HEAD').splitlines()
          tag_by_commit = {}
          for tag in git('tag', '--list').splitlines():
              if re.fullmatch(r'\d+\.\d+\.\d+', tag):
                  sha = git('rev-list', '-n', '1', tag)
                  tag_by_commit.setdefault(sha, []).append(tag)
          base_tag = None
          for sha in mainline:
              if sha in tag_by_commit:
                  base_tag = max(tag_by_commit[sha], key=lambda x: tuple(map(int, x.split('.'))))
                  break
          if not base_tag:
              raise SystemExit('No version tag found in first-parent history')

          major, minor, patch = map(int, base_tag.split('.'))
          messages = subprocess.check_output([
              'git', 'log', '--no-merges', '-z', '--format=%B', f'{base_tag}..HEAD'
          ]).decode('utf-8').split('\x00')
          bump = 0
          for message in messages:
              message = message.strip()
              if not message:
                  continue
              first_line = message.splitlines()[0]
              match = re.match(r'^([a-z][a-z0-9-]*)(?:\([^)]+\))?(!)?:\s+\S', first_line, re.I)
              if not match:
                  continue
              kind = match.group(1).lower()
              if match.group(2) or re.search(r'(?mi)^BREAKING[ -]CHANGE:\s+\S', message):
                  bump = max(bump, 3)
              elif kind == 'feat':
                  bump = max(bump, 2)
              elif kind in {'fix', 'perf', 'revert'}:
                  bump = max(bump, 1)

          version = (
              f'{major + 1}.0.0' if bump == 3 else
              f'{major}.{minor + 1}.0' if bump == 2 else
              f'{major}.{minor}.{patch + 1}' if bump == 1 else base_tag
          )
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              print(f'version={version}', file=output)
              print(f'has_version_bump={str(bump > 0).lower()}', file=output)
          print(f'Last version tag: {base_tag}; bump: {bump}; build version: {version}')
          PY

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '16.15.1'
          cache: npm
          cache-dependency-path: tasks/extractor/package-lock.json

      - name: npm install
        run: npm install --global npm@8.11.0

      - name: Install locked task dependencies
        run: npm ci --no-audit --no-fund
        working-directory: tasks/extractor

      - name: Compile TypeScript with the historical TypeScript toolchain
        run: |
          npm install --global typescript@4.7.4 --no-audit --no-fund
          tsc --version
          tsc
          npx --no-install tsc-alias
        working-directory: tasks/extractor

      - name: Check the expected task entry point
        run: test -s tasks/extractor/dist/index.js

      - name: Prune development-only dependencies before packaging
        run: npm prune --omit=dev --no-audit --no-fund
        working-directory: tasks/extractor

      - name: Remove build-time-only files from the task package
        shell: bash
        run: |
          set -euo pipefail
          rm -rf tasks/extractor/src tasks/extractor/tests
          rm -f tasks/extractor/.eslintignore tasks/extractor/.eslintrc.js
          rm -f tasks/extractor/.gitignore tasks/extractor/.prettierignore
          rm -f tasks/extractor/.prettierrc.json tasks/extractor/.taskkey
          rm -f tasks/extractor/icon.svg
          rm -f tasks/extractor/package.json tasks/extractor/package-lock.json
          rm -f tasks/extractor/tsconfig.json

      - name: Install pinned Azure DevOps VSIX packager
        run: npm install --global tfx-cli@0.11.0 --no-audit --no-fund

      - name: Package from source without modifying the manifest
        shell: bash
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          mkdir -p dist
          tfx extension create \
            --manifest-globs vss-extension.json \
            --override "{\"version\":\"$VERSION\"}" \
            --output-path "dist/$VSIX_PREFIX-$VERSION.vsix" \
            --no-prompt
          test -s "dist/$VSIX_PREFIX-$VERSION.vsix"
          git diff --exit-code -- vss-extension.json

      - name: Verify generated VSIX structure and version
        shell: bash
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          python3 - <<'PY'
          import os
          import xml.etree.ElementTree as ET
          from pathlib import Path
          from zipfile import ZipFile

          version = os.environ['VERSION']
          path = Path('dist') / f"{os.environ['VSIX_PREFIX']}-{version}.vsix"
          if not path.is_file() or path.stat().st_size == 0:
              raise SystemExit('VSIX was not created')
          with ZipFile(path) as archive:
              broken = archive.testzip()
              if broken:
                  raise SystemExit(f'Damaged VSIX entry: {broken}')
              names = set(archive.namelist())
              required = {'extension.vsixmanifest', 'tasks/extractor/task.json', 'tasks/extractor/dist/index.js'}
              if missing := required - names:
                  raise SystemExit(f'Missing required VSIX entries: {sorted(missing)}')
              root = ET.fromstring(archive.read('extension.vsixmanifest'))
              ids = [node for node in root.iter() if node.tag.rsplit('}', 1)[-1] == 'Identity']
              if len(ids) != 1 or ids[0].get('Version') != version:
                  raise SystemExit('Packaged extension version does not match calculated version')
          print(f'Validated {path.name}: {path.stat().st_size} bytes, {len(names)} entries, version {version}')
          PY

      - name: Upload built VSIX
        uses: actions/upload-artifact@v4
        with:
          name: vsix-source-build
          path: dist/*.vsix
          if-no-files-found: error

  publish:
    if: (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/main' && needs.build.outputs.has_version_bump == 'true'
    needs: build
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      VERSION: ${{ needs.build.outputs.version }}
      VSIX_PREFIX: AttilaHajdu.jira-issue-extractor
    steps:
      - name: Download source-built VSIX
        uses: actions/download-artifact@v4
        with:
          name: vsix-source-build
          path: dist

      - name: Refuse to overwrite an existing release
        shell: bash
        run: |
          set -euo pipefail
          if gh release view "$VERSION" >/dev/null 2>&1; then
            echo "::error::Release $VERSION already exists; refusing to overwrite."
            exit 1
          fi
          test -s "dist/$VSIX_PREFIX-$VERSION.vsix"

      - name: Publish to Visual Studio Marketplace if credentials exist
        shell: bash
        env:
          MARKETPLACE_PAT: ${{ secrets.MARKETPLACE_PAT }}
        run: |
          set -euo pipefail
          if [ -z "$MARKETPLACE_PAT" ]; then
            echo "::notice::Marketplace upload skipped: MARKETPLACE_PAT secret missing."
            exit 0
          fi
          npm install --global tfx-cli@0.11.0 --no-audit --no-fund
          tfx extension publish --publisher AttilaHajdu \
            --vsix "dist/$VSIX_PREFIX-$VERSION.vsix" \
            --auth-type pat --token "$MARKETPLACE_PAT" --no-prompt

      - name: Publish the source-built VSIX as a GitHub Release
        shell: bash
        run: |
          set -euo pipefail
          gh release create "$VERSION" "dist/$VSIX_PREFIX-$VERSION.vsix" \
            --target "$GITHUB_SHA" --title "$VERSION" \
            --notes "Built from source using npm ci, TypeScript and tfx-cli. Version computed from conventional commits."
