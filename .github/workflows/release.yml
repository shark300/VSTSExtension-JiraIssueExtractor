name: Build and release Azure DevOps VSIX

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    if: github.event_name == 'pull_request' || github.ref == 'refs/heads/main'
    runs-on: windows-2022
    defaults:
      run:
        shell: bash
    outputs:
      version: ${{ steps.version.outputs.version }}
      has_version_bump: ${{ steps.version.outputs.has_version_bump }}
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      VSIX_PREFIX: ${{ github.event_name != 'workflow_dispatch' && 'AttilaHajdu.jira-issue-extractor-dev' || 'AttilaHajdu.jira-issue-extractor' }}
      MANIFEST_FILE: ${{ github.event_name != 'workflow_dispatch' && 'vss-extension.dev.json' || 'vss-extension.json' }}
    steps:
      - name: Preserve source file line endings on Windows
        run: git config --global core.autocrlf false

      - name: Checkout source with full commit history
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Node.js for git-cliff
        uses: actions/setup-node@v7
        with:
          node-version: '24'

      - name: Install git-cliff
        run: npm install --global git-cliff@2.14.2 --no-audit --no-fund

      - name: Calculate SemVer with git-cliff
        id: version
        shell: bash
        run: |
          set -euo pipefail
          BASE_VERSION="$(git-cliff --config .github/cliff.toml --use-branch-tags --bumped-version)"
          [[ "$BASE_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || {
            echo "::error::git-cliff returned an invalid base version: $BASE_VERSION"
            exit 1
          }
          if [ "$GITHUB_EVENT_NAME" != "workflow_dispatch" ]; then
            # VSIX Identity.Version requires numeric components; keep SemVer prerelease in the filename.
            VERSION="$BASE_VERSION.$GITHUB_RUN_NUMBER"
            ARTIFACT_VERSION="$BASE_VERSION-$GITHUB_RUN_NUMBER"
            HAS_VERSION_BUMP=false
          else
            VERSION="$BASE_VERSION"
            ARTIFACT_VERSION="$BASE_VERSION"
            if git rev-parse --verify -q "refs/tags/$VERSION" >/dev/null; then
              HAS_VERSION_BUMP=false
            else
              HAS_VERSION_BUMP=true
            fi
          fi
          {
            echo "version=$VERSION"
            echo "artifact_version=$ARTIFACT_VERSION"
            echo "has_version_bump=$HAS_VERSION_BUMP"
          } >> "$GITHUB_OUTPUT"
          echo "Base version: $BASE_VERSION; VSIX version: $VERSION; artifact version: $ARTIFACT_VERSION; version bump: $HAS_VERSION_BUMP"

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: tasks/extractor/package-lock.json

      - name: Install task dependencies
        run: npm ci --no-audit --no-fund
        working-directory: tasks/extractor

      - name: Compile TypeScript
        run: |
          npm run build
        working-directory: tasks/extractor

      - name: Check the expected task entry point
        run: test -s tasks/extractor/dist/index.js

      - name: Prune development-only dependencies before packaging
        run: npm prune --omit=dev --no-audit --no-fund
        working-directory: tasks/extractor

      - name: Remove build-time-only files from the task package
        shell: bash
        run: |
          set -euo pipefail
          rm -rf tasks/extractor/src tasks/extractor/tests
          rm -f tasks/extractor/.eslintignore tasks/extractor/.eslintrc.js
          rm -f tasks/extractor/.gitignore tasks/extractor/.prettierignore
          rm -f tasks/extractor/.prettierrc.json tasks/extractor/.taskkey
          rm -f tasks/extractor/icon.svg
          rm -f tasks/extractor/package.json tasks/extractor/package-lock.json
          rm -f tasks/extractor/tsconfig.json

      - name: Install Azure DevOps VSIX packager
        run: npm install --global tfx-cli@0.11.0 --no-audit --no-fund

      - name: Prepare isolated private dev extension for non-release builds
        if: github.event_name != 'workflow_dispatch'
        shell: bash
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path

          manifest = json.loads(Path('vss-extension.json').read_text(encoding='utf-8'))
          manifest['id'] = 'jira-issue-extractor-dev'
          manifest['name'] = 'Jira Issue Extractor Dev'
          manifest['public'] = False
          for contribution in manifest['contributions']:
              contribution['id'] += '-dev'
          Path('vss-extension.dev.json').write_text(json.dumps(manifest, indent=2) + '\n', encoding='utf-8')

          task_path = Path('tasks/extractor/task.json')
          task = json.loads(task_path.read_text(encoding='utf-8'))
          task['id'] = 'e74abf75-8b4f-4d1f-bc17-47f109d2ad42'
          task['name'] = 'JiraIssueKeyExtractorDev'
          task['friendlyName'] = 'Jira Issue Key Extractor Dev'
          task_path.write_text(json.dumps(task, indent=2) + '\n', encoding='utf-8')
          PY

      - name: Build package
        shell: bash
        env:
          VERSION: ${{ steps.version.outputs.version }}
          ARTIFACT_VERSION: ${{ steps.version.outputs.artifact_version }}
        run: |
          set -euo pipefail
          mkdir -p dist
          tfx extension create \
            --manifest-globs "$MANIFEST_FILE" \
            --override "{\"version\":\"$VERSION\"}" \
            --output-path "dist/$VSIX_PREFIX-$ARTIFACT_VERSION.vsix" \
            --no-prompt
          test -s "dist/$VSIX_PREFIX-$ARTIFACT_VERSION.vsix"
          git diff --exit-code -- vss-extension.json

      - name: Verify generated VSIX structure and version
        shell: bash
        env:
          VERSION: ${{ steps.version.outputs.version }}
          ARTIFACT_VERSION: ${{ steps.version.outputs.artifact_version }}
        run: |
          python3 - <<'PY'
          import os
          import xml.etree.ElementTree as ET
          from pathlib import Path
          from zipfile import ZipFile

          version = os.environ['VERSION']
          path = Path('dist') / f"{os.environ['VSIX_PREFIX']}-{os.environ['ARTIFACT_VERSION']}.vsix"
          if not path.is_file() or path.stat().st_size == 0:
              raise SystemExit('VSIX was not created')
          with ZipFile(path) as archive:
              broken = archive.testzip()
              if broken:
                  raise SystemExit(f'Damaged VSIX entry: {broken}')
              names = set(archive.namelist())
              required = {'extension.vsixmanifest', 'tasks/extractor/task.json', 'tasks/extractor/dist/index.js'}
              if missing := required - names:
                  raise SystemExit(f'Missing required VSIX entries: {sorted(missing)}')
              import json
              task = json.loads(archive.read('tasks/extractor/task.json'))
              if set(task.get('execution', {})) != {'Node24'}:
                  raise SystemExit('Packaged task does not exclusively target Node24')
              is_dev = os.environ['GITHUB_EVENT_NAME'] != 'workflow_dispatch'
              expected_task_name = 'JiraIssueKeyExtractorDev' if is_dev else 'JiraIssueKeyExtractor'
              if task.get('name') != expected_task_name:
                  raise SystemExit(f'Unexpected packaged task name: {task.get("name")}')
              task_version = task.get('version', {})
              if not all(isinstance(task_version.get(k), int) for k in ('Major', 'Minor', 'Patch')):
                  raise SystemExit('Invalid packaged task version')
              root = ET.fromstring(archive.read('extension.vsixmanifest'))
              ids = [node for node in root.iter() if node.tag.rsplit('}', 1)[-1] == 'Identity']
              if len(ids) != 1 or ids[0].get('Version') != version:
                  raise SystemExit('Packaged extension version does not match calculated version')
              expected_extension_id = 'jira-issue-extractor-dev' if is_dev else 'jira-issue-extractor'
              if ids[0].get('Id') != expected_extension_id:
                  raise SystemExit(f'Unexpected extension ID: {ids[0].get("Id")}')
          print(f'Validated {path.name}: {path.stat().st_size} bytes, {len(names)} entries, version {version}')
          PY

      - name: Upload built VSIX
        uses: actions/upload-artifact@v7
        with:
          name: ${{ github.event_name != 'workflow_dispatch' && 'vsix-dev' || 'vsix-source-build' }}
          path: dist/*.vsix
          if-no-files-found: error

  publish:
    # Build on every main push, but publish only when explicitly requested.
    if: >-
      github.event_name == 'workflow_dispatch' &&
      github.ref == 'refs/heads/main' &&
      needs.build.outputs.has_version_bump == 'true'
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      VERSION: ${{ needs.build.outputs.version }}
      VSIX_PREFIX: AttilaHajdu.jira-issue-extractor
    steps:
      - name: Download source-built VSIX
        uses: actions/download-artifact@v8
        with:
          name: vsix-source-build
          path: dist

      - name: Refuse to overwrite an existing release
        shell: bash
        run: |
          set -euo pipefail
          if gh release view "$VERSION" >/dev/null 2>&1; then
            echo "::error::Release $VERSION already exists; refusing to overwrite."
            exit 1
          fi
          test -s "dist/$VSIX_PREFIX-$VERSION.vsix"

      - name: Publish to Visual Studio Marketplace if credentials exist
        shell: bash
        env:
          MARKETPLACE_PAT: ${{ secrets.MARKETPLACE_PAT }}
        run: |
          set -euo pipefail
          if [ -z "$MARKETPLACE_PAT" ]; then
            echo "::notice::Marketplace upload skipped: MARKETPLACE_PAT secret missing."
            exit 0
          fi
          npm install --global tfx-cli@0.11.0 --no-audit --no-fund
          tfx extension publish --publisher AttilaHajdu \
            --vsix "dist/$VSIX_PREFIX-$VERSION.vsix" \
            --auth-type pat --token "$MARKETPLACE_PAT" --no-prompt

      - name: Publish the source-built VSIX as a GitHub Release
        shell: bash
        run: |
          set -euo pipefail
          gh release create "$VERSION" "dist/$VSIX_PREFIX-$VERSION.vsix" \
            --target "$GITHUB_SHA" --title "$VERSION" \
            --notes ""
