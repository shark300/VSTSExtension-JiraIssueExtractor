name: VSTSExtension-JiraIssueExtractor CI
on: [pull_request, push]

permissions:
  contents: read

jobs:
  code_lint:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: tasks/extractor/package-lock.json
      - run: npm ci
        working-directory: tasks/extractor
      - run: npm run lint:check
        working-directory: tasks/extractor

  unit_test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: tasks/extractor/package-lock.json
      - run: npm ci
        working-directory: tasks/extractor
      - run: npm test
        working-directory: tasks/extractor

  integration_test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: tasks/extractor/package-lock.json
      - run: npm ci
        working-directory: tasks/extractor
      - run: npm run integrationTest
        working-directory: tasks/extractor
      - run: test -f dist/index.js
        working-directory: tasks/extractor
